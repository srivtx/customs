<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <!-- Customs — the centered lockup: the gate diamond above the wordmark.
       Night tile: reads on light and dark GitHub alike. -->
  <rect x="0.5" y="0.5" width="759" height="299" rx="16" fill="#050505" stroke="rgba(255,255,255,0.12)"/>

  <!-- the mark -->
  <path fill="#f4f4f0" fill-rule="evenodd"
    d="M380 44 L446 110 L380 176 L314 110 Z M363 81 A8 8 0 0 1 397 81 L397 139 A8 8 0 0 1 363 139 Z"/>

  <!-- the wordmark — tight, quiet, one line -->
  <text x="380" y="228" text-anchor="middle"
    font-family="'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-weight="600" font-size="64" letter-spacing="-2.5" fill="#f4f4f0">Customs</text>

  <!-- the line -->
  <text x="380" y="266" text-anchor="middle"
    font-family="'Geist Mono', 'SFMono-Regular', Consolas, monospace"
    font-size="15" letter-spacing="5.5" fill="#a2c0a9">THE CHECKPOINT FOR AGENTIC COMMERCE</text>
</svg>
